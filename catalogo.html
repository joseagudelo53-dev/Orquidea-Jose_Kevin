<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo · Orquídea</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/tienda.js" defer></script>
</head>
<body class="container py-3">
    <header class="encabezado">
        <h1>📦 Catálogo</h1>
        <p>Cada producto dice cuánto le ahorra al mes, con una tarifa de 950 COP/kWh.</p>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <div class="buscador-container">
            <label for="buscador" class="form-label">Buscar productos:</label>
            <input
                type="text"
                id="buscador"
                class="form-control mb-3"
                placeholder="🔍 Buscar producto por nombre..."
                aria-label="Buscador de productos"
            >
        </div>

        <div class="filtros" role="group" aria-label="Filtrar por categoría">
            <button class="filtro activo" data-categoria="todas" aria-pressed="true">Todas</button>
            <button class="filtro" data-categoria="iluminacion" aria-pressed="false">Iluminación</button>
            <button class="filtro" data-categoria="electrodomesticos" aria-pressed="false">Electrodomésticos</button>
            <button class="filtro" data-categoria="solar" aria-pressed="false">Energía solar</button>
        </div>

        <div class="catalogo">
            <div id="productos" class="tarjetas"></div>

            <aside id="carrito">
                <h2>🛒 Carrito</h2>
                <ul id="lista-carrito"></ul>
                <p id="total"></p>
                <p id="ahorro"></p>
                <button id="vaciar" class="btn btn-outline-secondary btn-sm">Vaciar carrito</button>
            </aside>
        </div>
    </main>

    <footer class="pie">
        <p>Los productos y sus precios son de ejemplo educativo.</p>
        <p>Orquídea · Proyecto educativo · Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
    </footer>
</body>
</html>
